# yaml-language-server: $schema=../test-schema.json
id: agora_market_smoke
name: "Agora Market — deterministic Flutter PWA smoke test"
url: "https://redandan.github.io/"

max_iterations: 4
timeout_secs: 90
max_retries: 1  # H5 Flutter 偶發 Chrome 初始化延遲，自動重試一次
fixture_only: true

# H5 mobile viewport — AgoraMarket 會員端是手機版 App，必須用手機 viewport 測試
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/"}
    - {action: "wait", target: "8000"}
    - {action: "dismiss_passkey_prompt"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_url_matches", target: "/#\\/(home|login)/"}
    - {action: "assert_ax_contains", target: "Agora Market"}
  cleanup:
    - {action: "clear_state"}

goal: |
  測試 Agora Market Flutter PWA 能正常載入並顯示首頁商城內容。

  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。
  ⚠️ Flutter CanvasKit app：使用 enable_a11y + AX assertions 判斷首頁是否真的載入。
  ⚠️ 這是 smoke test，只驗證 PWA 能從 root route 載入到 home 或 login surface，並有可見 Flutter/AX 內容。

  Historical note: the previous vision-only ReAct goal could see the page content
  and still time out before emitting done=true. This deterministic fixture keeps
  the same smoke boundary without spending LLM turns.

success_criteria:
  - "URL reaches #/home or #/login after root route load"
  - "AX tree contains Agora Market"

tags: [smoke, flutter, agora, deterministic, fixture]
