id: agora_admin_product_import
name: "AgoraMarket Admin 商品列表 + 分類篩選 + 狀態 chip (Issue #70 #4 #20 #22)"
url: "https://redandan.github.io/?__test_role=admin"

max_iterations: 18
timeout_secs: 300
fixture_only: true
# Admin 後台是 PC 桌面版，使用標準桌面 viewport
viewport:
  width: 1280
  height: 900
  scale: 1.0
  mobile: false

locale: zh-TW

# 2026-05-05 perf — moved deterministic boot steps from goal to fixture.setup
# (saves ~10-30s LLM time per LLM-mode run; scripted = 0 LLM cost).
fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=admin"}
    - {action: "wait", target: "3000"}
    - {action: "wait_for_flutter_semantics", timeout: 15000, min_roles: 2}
    - {action: "dismiss_passkey_prompt"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=admin"}
    - {action: "wait", target: "5000"}
    - {action: "wait_for_flutter_semantics", timeout: 25000, min_roles: 8}
    - {action: "shadow_click", role: "button", name_regex: "^商品與電商(\\n商品與電商)?$"}
    - {action: "wait", target: "3000"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 20}
    - {action: "shadow_find", name_regex: "總產品數|上架中"}
    - {action: "shadow_find", name_regex: "3M Scotch|商品|產品分類"}
    - {action: "shadow_find", role: "button", name_regex: "^請選擇產品分類$"}
    - {action: "shadow_click", role: "button", name_regex: "^請選擇產品分類$"}
    - {action: "wait", target: "1500"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 20}
    - {action: "shadow_find", name_regex: "電子產品|手機|服飾|家居|食品|全部"}

goal: |
  目標：fixture-only 驗證管理員「商品與電商」頁商品列表載入與分類篩選入口。
  覆蓋 Issue #70 子問題 #4（分類篩選）與 #20（AX tree 不折疊）。

  ⚠️ 注意：商品匯入功能（#49）在目前 Admin UI 中尚未提供入口，本測試不驗證匯入功能。
  ⚠️ 本 deterministic 版本不使用 screenshot_analyze；#22 狀態 chip 色碼仍需另開視覺測試覆蓋。

  fixture.setup 已完成：
  - clear_state + admin URL 導航
  - Passkey prompt dismiss
  - 點擊「商品與電商」
  - 確認商品列表文字/產品分類按鈕存在
  - 點擊「請選擇產品分類」
  - 確認分類 dropdown 或分類選項出現

  fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。

success_criteria:
  - "商品與電商頁可開啟並看到商品列表（有商品資料，頁面正常載入）"
  - "點擊「請選擇產品分類」按鈕後，dropdown 展開或分類選項可見（覆蓋 #4）"
  - "分類操作後 shadow tree 仍有足夠節點且商品列表沒有消失（覆蓋 #20）"

tags: [agora, regression, admin, product, import, category-filter, issue-70, critical]
