id: agora_c2c_delivery_dashboard
name: "C2C 核心流程：外送員儀表板 UI 驗證"
# 兩階段 nav 修法（KB: sirin-trap-test-role-hash-lost-on-login-redirect）：
# Stage 1（fixture.setup 第一個 goto）：?__test_role=delivery 觸發 auto-login，落 LoginPage
# Stage 2（fixture.setup 第二個 goto）：cached JWT 跳過 LoginPage，落 #/delivery dashboard
# top-level url 故意省 hash，避免初次 goto 帶 hash route 被 guard 擋進 LoginPage 後遺失
url: "https://redandan.github.io/?__test_role=delivery"

max_iterations: 20
timeout_secs: 360
max_retries: 1

# Fixture: 兩階段 deterministic goto，跑在 LLM ReAct 之前（top-level url 已是 stage 1）
fixture:
  setup:
    - {action: "wait", target: "8000"}                                       # 等 stage 1 auto-login + redirect
    - {action: "goto", target: "https://redandan.github.io/#/delivery"}      # stage 2：JWT 已 cached，落 dashboard
    - {action: "wait", target: "3000"}                                       # 等 dashboard render

# H5 mobile viewport — 外送員後台是手機版
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

goal: |
  目標：驗證外送員儀表板已正常載入並顯示核心資訊。

  fixture.setup 已完成兩階段 navigation（auto-login + 落 #/delivery），
  LLM 開始時頁面應該已經在 delivery dashboard。

  Dashboard 預期元素（mobile 390x844 viewport）：
  - 標題「外送首頁」
  - 工作狀態 toggle（switch 顯示「正在接單中」或「停止接單」）
  - 使用者卡片含「今日收入：X.XX USDT」「完成訂單：N 筆」
  - 快捷功能 grid：歷史訂單 / 配送指南 / 訊息中心 / 個人設定
  - 底部 4 個 tab：首頁 / 訂單 / 收入 / 我的（注意是 delivery 的 nav，不是 buyer 的 商品/訂單/錢包/我的）

  ⚠️ 嚴禁 shadow_dump（AX tree 未就緒時回空 → convergence guard 循環）
  ⚠️ 步驟 6 無條件 done=true，嚴禁提早終止

  步驟（線性，步驟 6 done=true）：
  1. enable_a11y
  2. wait 2000
  3. screenshot_analyze "外送首頁截圖：請確認是否有 (a) 工作狀態 toggle (b) 今日收入金額 (c) 完成訂單數量 (d) 底部 nav 包含「首頁/訂單/收入/我的」這 4 個分頁"
  4. shadow_click role=tab name_regex="^訂單$"（切到訂單 tab，驗證 nav 切換正常）
  5. wait 2000
  6. done=true

success_criteria:
  - "成功載入外送員儀表板（#/delivery）"
  - "儀表板顯示今日統計（收入、完成訂單數）"
  - "有工作狀態開關（接單/停止）"
  - "有底部導航 tab（首頁/訂單/收入/我的）"

tags: [c2c, delivery, dashboard, regression, core-flow]
