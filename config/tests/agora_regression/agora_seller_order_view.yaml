id: agora_seller_order_view
name: "AgoraMarket 賣家訂單管理頁驗證"
url: "https://redandan.github.io/?__test_role=seller"

max_iterations: 4
timeout_secs: 120
fixture_only: true

# Seller 後台是 H5 手機版，與 Buyer 相同 viewport
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait_for_flutter_semantics", timeout: 15000, min_roles: 2}
    - {action: "dismiss_passkey_prompt"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait_for_flutter_semantics", timeout: 25000, min_roles: 8}
    - {action: "agora_nav_click", target: "訂單"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "assert_url_matches", target: "#/seller"}
    - {action: "shadow_find", role: "tab", name_regex: "^待處理$"}
    - {action: "shadow_find", role: "tab", name_regex: "^運送中$"}
    - {action: "shadow_find", name_regex: "訂單編號|待處理訂單總覽|訂單"}

goal: |
  目標：確認賣家訂單管理頁的 tab 分類和訂單列表正常顯示。

  起始狀態：fixture.setup 已完成 clear_state、seller URL 導航、Passkey prompt dismiss、
  點擊底部訂單分頁、enable_a11y；應位於賣家訂單頁。

  ⚠️ 賣家首頁是儀表板（賣場設定/批量導入商品），不是訂單列表。
    必須先點底部「訂單」tab 才能進入賣家訂單管理頁。
  ⚠️ 新版賣家首頁使用 #/seller 單一路由承載首頁/商品/訂單/錢包 tab；
     URL 不變不代表 tab 沒切換，必須以 shadow_dump 內容判斷。
  ⚠️ 不論任何步驟失敗，都必須繼續執行到步驟 2 才能輸出 done=true。嚴禁提早終止。

  步驟（線性，步驟 2 無條件 done=true，不得提早）：
  1. shadow_dump（應看到全部/待處理/運送中/已完成，以及訂單卡片或空列表）
  2. done=true

success_criteria:
  - "成功點擊底部訂單 tab 並進入賣家訂單管理頁"
  - "看到訂單分類 tab（至少有待處理分類）"
  - "頁面有回應（有訂單、空列表、或 API 錯誤提示都算通過）"

tags: [regression, smoke, active-smoke, orders, seller, agora]
