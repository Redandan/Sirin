id: agora_c2c_seller_orders
name: "C2C 核心流程：賣家訂單管理頁 UI 驗證"
url: "https://redandan.github.io/?__test_role=seller"

max_iterations: 12
timeout_secs: 180
max_retries: 0

# H5 mobile viewport — Seller 後台是手機版
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW
llm_override:
  provider: lmstudio
  model: gemma-3-1b-it

goal: |
  目標：驗證賣家訂單管理頁可正常載入，所有訂單狀態分類 tab 顯示正確。

  起始狀態：賣家已 auto-login，在賣家儀表板首頁。

  已知資訊：
  - 底部有 4 個 tab：商品、訂單、錢包、我的
  - 目前訂單頁狀態 tab 為：全部、待處理、運送中、已完成
  - 無訂單時顯示「暫無訂單」或空列表（正常現象）

  ⚠️ 步驟 12 無條件 done=true。

  步驟（線性，步驟 12 done=true）：
  1. wait 3000
  2. enable_a11y
  3. wait 1500
  4. shadow_click role=tab name_regex="^訂單$"（點底部訂單 tab）
  5. wait 2500
  6. enable_a11y
  7. wait 1000
  8. shadow_dump（確認訂單管理頁已載入，找到 tab 列表）
  10. shadow_click role=tab name_regex="^待處理$|^運送中$"（切換到可操作中的訂單 tab）
  11. wait 1500
  12. shadow_dump（確認已切換到目標 tab，允許空列表）
  13. done=true

success_criteria:
  - "成功進入賣家訂單管理頁"
  - "看到至少 4 個訂單狀態分類 tab（全部/待處理/運送中/已完成）"
  - "成功切換到待處理或運送中 tab（空列表或有訂單均可）"

tags: [c2c, seller, orders, regression, core-flow]
