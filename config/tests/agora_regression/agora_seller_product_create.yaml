id: agora_seller_product_create
name: "AgoraMarket 賣家新增商品表單驗證"
url: "https://redandan.github.io/?__test_role=seller"

max_iterations: 25
timeout_secs: 180
fixture_only: true

# Seller 後台是 H5 手機版，與 Buyer 相同 viewport
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

# 2026-06-03: AgoraMarket now may show Passkey onboarding before tabs.
# Keep boot deterministic and no-op dismiss the prompt when it is absent.
fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait", target: "5000"}
    - {action: "wait_for_flutter_semantics", timeout: 15000, min_roles: 2}
    - {action: "dismiss_passkey_prompt"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait", target: "7000"}
    - {action: "wait_for_flutter_semantics", timeout: 25000, min_roles: 8}
    - {action: "agora_nav_click", target: "商品"}
    - {action: "wait", target: "2500"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "shadow_find", role: "button", name_regex: "^新增商品$"}
    - {action: "shadow_click", role: "button", name_regex: "^新增商品$"}
    - {action: "wait", target: "4000"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "flutter_scroll_until_visible", role: "button", name_regex: "出貨設定|物流設定"}
    - {action: "shadow_click", role: "button", name_regex: "出貨設定|物流設定"}
    - {action: "wait", target: "1500"}
    - {action: "enable_a11y"}
    - {action: "wait", target: "800"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "shadow_find", role: "button", name_regex: "平台配送設定|使用賣家自行配送"}

goal: |
  目標：fixture-only smoke，確認賣家可正常進入「新增商品」頁面並到達出貨/物流設定入口。

  起始狀態：fixture.setup 已完成 clear_state、seller URL 導航、Passkey prompt dismiss、
  點擊底部商品分頁、進入新增商品頁、打開出貨/物流設定，並確認平台配送設定入口可見。

  ⚠️ 新版 UI 可能顯示「出貨設定」，舊版/部分文件仍稱「物流設定」；selector 必須同時容忍兩者。
  ⚠️ 目前 shadow tree 將「出貨設定」「物流設定」暴露為 button；不要依舊文件假設 role=group。
  ⚠️ 本測試不判斷宅配/7-ELEVEN 預設開關值或運費數字；那些需要進一步展開平台配送設定後再另開深測。
  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。

  fixture 驗證：
  - 商品列表可找到「新增商品」
  - 新增商品頁可找到並打開「出貨設定」或「物流設定」
  - 打開後可找到「平台配送設定」或「使用賣家自行配送」

success_criteria:
  - "成功從商品管理列表點擊新增商品並進入新增頁面"
  - "成功打開出貨/物流設定區塊"
  - "看到平台配送設定入口或使用賣家自行配送狀態"

tags: [regression, deep-regression, product, seller, create, agora]
