id: agora_c2c_seller_ship
name: "C2C 後段流程：賣家確認訂單並出貨"
url: "https://redandan.github.io/?__test_role=seller"

max_iterations: 30
timeout_secs: 180
fixture_only: true

# Seller 後台是 H5 手機版
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

# AgoraMarket may show Passkey onboarding before seller tabs.
# This smoke validates the seller shipping entry without mutating orders.
fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait", target: "5000"}
    - {action: "wait_for_flutter_semantics", timeout: 15000, min_roles: 2}
    - {action: "dismiss_passkey_prompt"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait", target: "7000"}
    - {action: "wait_for_flutter_semantics", timeout: 25000, min_roles: 8}
    - {action: "agora_nav_click", target: "訂單"}
    - {action: "wait", target: "2500"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "assert_url_matches", target: "#/seller"}
    - {action: "shadow_find", role: "tab", name_regex: "^待處理$"}
    - {action: "shadow_click", role: "tab", name_regex: "^待處理$|^待出貨$"}
    - {action: "wait", target: "1500"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "shadow_find", name_regex: "待處理|待出貨|暫無訂單|訂單|出貨|物流"}

goal: |
  目標：fixture-only smoke，驗證賣家可穩定進入訂單管理頁的待處理/待出貨入口。

  ⚠️ 測試依賴：需要帳號中有「待出貨」狀態的訂單（由 c2c_place_order 產生）。
  ⚠️ 若無待出貨訂單，看到空列表或訂單頁狀態即可通過（不強制要求有訂單）。
  ⚠️ 本 smoke 不會點擊「出貨」或送出物流資料；避免測試環境產生訂單狀態副作用。
  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。

  已知 UI 流程：
  - 賣家訂單管理：訂單 tab → 待出貨 tab → 點訂單 → 填物流資訊 → 出貨
  - 出貨按鈕可能名稱：「出貨」「確認出貨」「填寫物流」「Send」
  - 物流欄位：物流公司名稱、追蹤號碼（填測試值即可）

  fixture 驗證：
  - cold-load 後等待 Flutter semantics ready
  - dismiss Passkey onboarding prompt
  - 成功進入賣家訂單 tab
  - 成功切到待處理或待出貨分類
  - 頁面顯示訂單/空列表/出貨相關狀態之一

success_criteria:
  - "成功進入賣家訂單管理頁並切到待出貨 tab"
  - "記錄待出貨訂單數量（0 筆或有 N 筆均合格）"
  - "若無待出貨訂單：空列表或訂單頁狀態即通過（測試環境無訂單為正常）"

tags: [c2c, seller, ship, orders, regression, issue-185]
