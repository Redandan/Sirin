id: agora_seller_wallet
name: "AgoraMarket 賣家錢包頁面驗證 v3 (seller tab UI)"
url: "https://redandan.github.io/?__test_role=seller"

max_iterations: 4
timeout_secs: 120
fixture_only: true

# Seller 後台是 H5 手機版，與 Buyer 相同 viewport
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait_for_flutter_semantics", timeout: 15000, min_roles: 2}
    - {action: "dismiss_passkey_prompt"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=seller"}
    - {action: "wait_for_flutter_semantics", timeout: 25000, min_roles: 8}
    - {action: "agora_nav_click", target: "錢包"}
    - {action: "wait_for_flutter_semantics", timeout: 12000, min_roles: 8}
    - {action: "assert_url_matches", target: "#/seller"}
    - {action: "shadow_find", name_regex: "總餘額|可用餘額"}
    - {action: "shadow_find", role: "button", name_regex: "^充值$"}
    - {action: "shadow_find", role: "button", name_regex: "^提現$"}

goal: |
  目標：確認賣家可從新版底部「錢包」tab 進入錢包頁，並看到餘額與操作按鈕。

  起始狀態：fixture.setup 已完成 clear_state、seller URL 導航、Passkey prompt dismiss、
  點擊底部錢包分頁、enable_a11y；應位於賣家錢包頁。

  ⚠️ 新版賣家首頁使用 #/seller 單一路由承載首頁/商品/訂單/錢包 tab；
     URL 不變不代表 tab 沒切換，必須以 shadow_dump 內容判斷。
  ⚠️ 步驟 2 無條件 done=true，嚴禁提早終止。

  步驟（線性，步驟 2 done=true）：
  1. shadow_dump（應看到總餘額、可用餘額、充值、提現、質押、交易記錄）
  2. done=true

success_criteria:
  - "成功點擊底部錢包 tab"
  - "錢包頁顯示總餘額或可用餘額"
  - "有操作按鈕（充值/提現/質押或類似功能）"

tags: [regression, smoke, active-smoke, wallet, seller, agora, seller-tab-ui]
