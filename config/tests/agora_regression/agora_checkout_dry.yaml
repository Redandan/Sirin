id: agora_checkout_dry
name: "AgoraMarket Checkout DRY 驗證 (Issue #70 #45)"
url: "https://redandan.github.io/?__test_role=buyer"

max_iterations: 15
timeout_secs: 360
max_retries: 1  # H5 Flutter 偶發 Chrome 初始化延遲，自動重試一次

# H5 mobile viewport — AgoraMarket 會員端是手機版 App，必須用手機 viewport 測試
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

# Fixture 把開場 5 步 deterministic 化（auto-login + a11y），
# 砍掉這些 LLM 不需要決策的雜訊，讓主迴圈只剩購買 flow 本身。
# Local LLM 友善（reduce screenshot_analyze + enable_a11y vision/ax-tree token bloat）。
fixture:
  setup:
    - {action: "wait", target: "5000"}              # 等 auto-login + Flutter 買家首頁
    - {action: "enable_a11y"}
    - {action: "wait", target: "2000"}              # 等 AX tree settle
    - {action: "enable_a11y"}                        # 二次確保 AX tree 就緒
    - {action: "wait", target: "1000"}

goal: |
  目標：驗證「直接購買」flow 結帳頁 UI 正常（Issue #70 #45）。

  起始狀態：fixture 已完成 buyer auto-login + a11y 初始化，頁面在首頁商品列表。

  ⚠️ Flutter CanvasKit app：UI 判斷用 screenshot_analyze（嚴禁 shadow_dump）。
  ⚠️ 安全模式：看到「下單」或「Place Order」按鈕即算通過，絕對不點擊下單！
  ⚠️ 步驟 7 無條件 done=true，嚴禁提早終止。

  步驟（直接購買 flow，6 個 LLM-driven actions + done）：
  1. shadow_click role=button name_regex="USDT"（點第一個商品卡進入詳情）
  2. wait 2500
  3. scroll y=400（捲到商品詳情頁底部找購買按鈕）
  4. shadow_click role=button name_regex="立即購買|確認購買|Buy Now|直接購買|購買"
  5. wait 3000
  6. screenshot_analyze "結帳頁驗證：看到訂單摘要、金額、可點擊的下單按鈕嗎？記錄狀態。"
  7. done=true（不要點下單！記錄結帳頁 UI 狀態即可）

success_criteria:
  - "從商品詳情頁可進入結帳頁面"
  - "結帳頁顯示訂單摘要與金額"
  - "「下單」按鈕存在且可點擊（非 disabled 狀態）"
  - "無 console error 或 'Something went wrong' 訊息"

tags: [checkout, agora, issue-70, regression, refactor-verification, selector-risk, needs-manual-verification]
