# yaml-language-server: $schema=../../test-schema.json
id: agora_c2c_buyer_confirm_receipt
name: "C2C 後段流程：買家確認收貨入口"
url: "https://redandan.github.io/?__test_role=buyer"

max_iterations: 8
timeout_secs: 150
max_retries: 1
fixture_only: true

# Buyer 是 H5 手機版
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=buyer"}
    - {action: "wait", target: "5000"}
    - {action: "dismiss_passkey_prompt"}
    - {action: "wait", target: "1000"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "agora_nav_click", target: "訂單"}
    - {action: "wait", target: "2500"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_ax_contains", target: "待收貨"}
    - {action: "shadow_click", role: "tab", name_regex: "^待收貨$"}
    - {action: "wait", target: "1500"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 8, timeout_ms: 10000}
    - {action: "shadow_find", name_regex: "待收貨|確認收貨|已收到|暫無訂單|訂單|尚無"}

goal: |
  目標：fixture-only smoke，驗證買家可從訂單頁進入「待收貨」入口。

  ⚠️ 本測試不點擊「確認收貨」，避免巡檢對 AgoraMarket 訂單狀態產生副作用。
  ⚠️ 真正確認收貨流程仍需要 operator 明確批准後，另跑 mutating 測試。
  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。

  已知 UI 流程：
  - 買家訂單：訂單 tab → 待收貨 tab → 點訂單 → 確認收貨按鈕
  - 確認按鈕可能名稱：「確認收貨」「Confirm Receipt」「已收到」

  fixture 驗證：
  - cold-load 後自動登入 buyer
  - dismiss Passkey onboarding prompt
  - 成功進入買家訂單 tab
  - 成功切到待收貨分類
  - 頁面顯示待收貨/訂單/確認收貨/空列表相關狀態之一

success_criteria:
  - "成功進入買家訂單頁並切到待收貨 tab"
  - "記錄待收貨訂單數量（0 筆或有 N 筆均合格）"
  - "巡檢不執行確認收貨；確認收貨 mutation 需 operator approval"

tags: [c2c, buyer, receipt, orders, regression, issue-185, non-mutating, fixture]
