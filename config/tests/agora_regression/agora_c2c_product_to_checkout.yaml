id: agora_c2c_product_to_checkout
name: "C2C 核心流程：買家商品→選規格→結帳確認頁"
url: "https://redandan.github.io/?__test_role=buyer"

max_iterations: 22
timeout_secs: 300
max_retries: 1
fixture_only: true

# H5 mobile viewport
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

# 2026-05-05 perf — moved deterministic boot steps from goal to fixture.setup
# (saves ~30s LLM time per LLM-mode run; scripted = 0 LLM cost).
fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=buyer"}
    - {action: "wait", target: "3000"}
    - {action: "dismiss_passkey_prompt"}
    - {action: "wait", target: "1000"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "shadow_click", role: "button", name_regex: "USDT"}
    - {action: "wait_for_url", target: "#/products/", timeout_ms: 15000}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_ax_contains", target: "購買"}
    - {action: "shadow_click", role: "button", name_regex: "^購買$"}
    - {action: "wait", target: "2000"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_ax_contains", target: "確認購買"}
    - {action: "shadow_click", role: "button", name_regex: "^確認購買$"}
    - {action: "wait_for_url", target: "#/purchase-confirm", timeout_ms: 15000}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_ax_contains", target: "確認購買"}

goal: |
  目標：驗證買家從商品列表到結帳確認頁的完整流程（C2C 核心路徑）。
  ⚠️ DRY RUN — 不真正下單，只驗證到 purchase-confirm 的「確認購買」按鈕出現即可。
  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。

  起始狀態：買家已 auto-login，在首頁商品列表。
  fixture.setup 會處理 Passkey prompt、進入商品詳情、開啟購買對話框、確認到
  #/purchase-confirm，並停在最終下單前。

  已知資訊：
  - 點「購買」按鈕後，彈出 SKU 規格選擇對話框（group:立即購買）
  - 對話框底部有「確認購買」按鈕
  - 點「確認購買」後跳到 #/purchase-confirm 頁面
  - purchase-confirm 頁有：商品摘要、寄送方式（7-ELEVEN 等）、總金額
  - 最終確認按鈕名稱格式可能是「確認購買 THB X.XX」或「確認購買 USDT X.XX」

  驗證點：
  - URL 必須到達 #/purchase-confirm
  - 頁面必須包含「確認購買」按鈕
  - 不點擊最終「確認購買 THB/USDT ...」按鈕

success_criteria:
  - "成功從商品列表進入商品詳情頁"
  - "成功開啟 SKU 選擇對話框並選擇規格"
  - "成功到達結帳確認頁（#/purchase-confirm）"
  - "結帳確認頁顯示商品摘要、運費選項、確認購買按鈕"
  - "流程未執行最終下單"

tags: [c2c, buyer, checkout, regression, core-flow, dry-run, fixture]
