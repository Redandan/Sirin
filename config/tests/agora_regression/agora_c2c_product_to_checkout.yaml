id: agora_c2c_product_to_checkout
name: "C2C 核心流程：買家商品→選規格→結帳確認頁"
url: "https://redandan.github.io/?__test_role=buyer"

max_iterations: 22
timeout_secs: 300
max_retries: 1

# H5 mobile viewport
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

locale: zh-TW

# 2026-05-05 perf — moved deterministic boot steps from goal to fixture.setup
# (saves ~30s LLM time per LLM-mode run; scripted = 0 LLM cost).
fixture:
  setup:
    - {action: "wait", target: "3000"}
    - {action: "enable_a11y"}
    - {action: "wait", target: "1500"}

goal: |
  目標：驗證買家從商品列表到結帳確認頁的完整流程（C2C 核心路徑）。
  ⚠️ DRY RUN — 不真正下單，只驗證到「確認購買 USDT X」按鈕出現即可。

  起始狀態：買家已 auto-login，在首頁商品列表。
  fixture.setup 已完成 3s 等待 + enable_a11y + 1.5s 等待，AX tree 已就緒。

  已知資訊：
  - 點「購買」按鈕後，彈出 SKU 規格選擇對話框（group:立即購買）
  - 對話框底部有「確認購買」按鈕
  - 點「確認購買」後跳到 #/purchase-confirm 頁面
  - purchase-confirm 頁有：商品摘要、寄送方式（7-ELEVEN 等）、總金額
  - 最終確認按鈕名稱格式：「確認購買 USDT X.XX」

  ⚠️ 嚴禁 click_point — 只用 shadow_click。
  ⚠️ 步驟 15 無條件 done=true。

  步驟（線性，步驟 15 done=true）：
  1. shadow_click role=button name_regex="USDT"（點第一個商品卡）
  2. wait 2500
  3. screenshot_analyze "是否在商品詳情頁？記錄商品名稱和價格。"
  4. scroll y=400（捲到底部找購買按鈕）
  5. shadow_click role=button name_regex="^購買$"（開啟規格選擇對話框）
  6. wait 2000
  7. shadow_click role=button name_regex="128GB|256GB|64GB|32GB"（選第一個 SKU）
  8. wait 1000
  9. shadow_click role=button name_regex="^確認購買$"（跳到 purchase-confirm）
  10. wait 3000
  11. enable_a11y
  12. wait 1000
  13. shadow_dump（確認在結帳頁，找到「確認購買 USDT」按鈕）
  14. screenshot_analyze "是否在結帳確認頁？看到商品名稱、運費選項、總金額？有「確認購買 USDT X」按鈕嗎？"
  15. done=true

success_criteria:
  - "成功從商品列表進入商品詳情頁"
  - "成功開啟 SKU 選擇對話框並選擇規格"
  - "成功到達結帳確認頁（#/purchase-confirm）"
  - "結帳確認頁顯示商品摘要、運費選項、確認購買按鈕"

tags: [c2c, buyer, checkout, regression, core-flow]
