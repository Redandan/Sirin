# yaml-language-server: $schema=../../test-schema.json
id: agora_search_keyword
name: "商品關鍵字搜尋測試"
url: "https://redandan.github.io/?__test_role=buyer"
locale: zh-TW

max_iterations: 8
timeout_secs: 150
max_retries: 1  # H5 Flutter 偶發 Chrome 初始化延遲，自動重試一次
fixture_only: true

# H5 mobile viewport — AgoraMarket 會員端是手機版 App，必須用手機 viewport 測試
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true

fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=buyer"}
    - {action: "wait", target: "5000"}
    - {action: "dismiss_passkey_prompt"}
    - {action: "wait", target: "1000"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "shadow_find", role: "button", name_regex: "輸入商品ID搜尋"}
    - {action: "shadow_click", role: "button", name_regex: "輸入商品ID搜尋"}
    - {action: "wait", target: "1500"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_url_matches", target: "#/search"}
    - {action: "assert_ax_contains", target: "搜尋商品"}
    - {action: "shadow_find", role: "button", name_regex: "熱門搜尋關鍵字 iPhone 15"}
    - {action: "shadow_click", role: "button", name_regex: "熱門搜尋關鍵字 iPhone 15"}
    - {action: "wait", target: "1500"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_ax_contains", target: "iPhone"}
    - {action: "shadow_find", role: "button", name_regex: "USDT"}

goal: |
  目標：fixture-only 驗證買家可進入搜尋頁，點選熱門關鍵字並看到商品結果。

  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。
  ⚠️ 不使用 click_point；搜尋入口與結果皆用 Flutter AX/shadow semantics 驗證。

  已知穩定路徑：
  - 首頁搜尋入口 AX name 是「輸入商品ID搜尋...」
  - 搜尋頁有「搜尋商品」textbox 與熱門搜尋關鍵字
  - 點「熱門搜尋關鍵字 iPhone 15」後，結果頁會顯示 iPhone 商品卡與 USDT 價格

success_criteria:
  - "成功找到搜尋入口（搜尋欄、搜尋圖示、或任何搜尋相關 UI）"
  - "成功進入 #/search"
  - "點熱門搜尋 iPhone 15 後看到 iPhone 商品結果"

tags: [agora, regression, search, fixture, non-mutating]
