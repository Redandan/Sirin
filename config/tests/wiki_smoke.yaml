id: wiki_smoke
name: "GitHub Wiki smoke test"
url: "https://github.com/Redandan/Redandan.github.io/wiki"
goal: |
  驗證 Agora Market 專案的 Wiki Home 頁面可以正常載入。
  應該看到 "Agora Market" 標題和專案簡介文字。

max_iterations: 6
timeout_secs: 60
fixture_only: true

fixture:
  setup:
    - {action: "wait", target: "2000"}
    - {action: "assert_url_matches", target: "github.com/Redandan/Redandan.github.io/wiki"}
    - {action: "assert_ax_contains", target: "Agora Market"}

success_criteria:
  - "成功看到文字「Agora Market」"
  - "成功停留在 github.com/.../wiki 路徑"

tags: [smoke, docs]
