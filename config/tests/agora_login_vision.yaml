id: agora_login_vision
name: "AgoraMarket 測試買家登入健康檢查"
url: "https://redandan.github.io/?__test_role=buyer"

max_iterations: 20
timeout_secs: 300
fixture_only: true
# H5 mobile viewport — AgoraMarket 會員端是手機版 App，必須用手機 viewport 測試
viewport:
  width: 390
  height: 844
  scale: 2.0
  mobile: true
max_retries: 1  # H5 Flutter 偶發 Chrome 初始化延遲，自動重試一次
retry_on_parse_error: 5

fixture:
  setup:
    - {action: "clear_state"}
    - {action: "goto", target: "https://redandan.github.io/?__test_role=buyer"}
    - {action: "wait", target: "5000"}
    - {action: "dismiss_passkey_prompt"}
    - {action: "wait", target: "1000"}
    - {action: "enable_a11y"}
    - {action: "wait_for_ax_ready", min_nodes: 10, timeout_ms: 10000}
    - {action: "assert_url_matches", target: "__test_role=buyer"}
    - {action: "assert_ax_contains", target: "商品"}
    - {action: "assert_ax_contains", target: "訂單"}
    - {action: "assert_ax_contains", target: "錢包"}
  cleanup:
    - {action: "clear_state"}

# Default Chrome viewport is now 1440×1600 at engine level (browser.rs),
# so the full login page — including the bottom test-account grid — is
# in-frame on turn 1.  No set_viewport workaround needed.
goal: |
  Verify buyer test-role login reaches an authenticated buyer surface.

  ⚠️ fixture_only=true；fixture.setup 全部成功即通過，不進 LLM ReAct loop。

  Historical note: this used to require vision/click_point on the "測試買家"
  button. The supported deterministic path is now ?__test_role=buyer plus AX
  assertions for the buyer tab surface.

success_criteria:
  - "URL contains __test_role=buyer and reaches the authenticated buyer surface"
  - "Buyer tabs 商品/訂單/錢包 are visible via AX assertions"

tags: [agora, login, flutter, canvas, regression]
